[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openviewcore"
version = "0.1.0"
description = "Street- and facade-level visual exposure simulation for urban environments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Adam Swietek"},
]
keywords = [
  "urban", "visibility", "solar", "ray-casting", "LiDAR",
  "street-view", "urban-heat-island", "GIS",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies — always required
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "geopandas>=0.13",
  "shapely>=2.0",
  "rioxarray>=0.14",
  "rasterio>=1.3",
  "xarray>=2023.1",
  "pyproj>=3.4",
  "point-cloud-utils>=0.29",
  "osmnx>=1.7",
  "py3dep>=0.16",
  "tqdm>=4.64",
  "pvlib>=0.10",
]

# Optional dependency groups
[project.optional-dependencies]
gee = [
  "earthengine-api>=0.1.370",
]
viz = [
  "pyvista>=0.42",
  "contextily>=1.4",
  "matplotlib>=3.7",
]
dev = [
  "pytest>=7.0",
  "pytest-cov",
]
all = [
  "openviewcore[gee,viz,dev]",
]

[project.urls]
Repository = "https://github.com/adamswietek/openview"
Documentation = "https://github.com/adamswietek/openview/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openviewcore*"]
